name: verificar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependências
        working-directory: hunt-analyzer
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: Harness completo
        shell: pwsh
        run: ./tools/verificar.ps1 -Perfil completo
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness
          path: output/harness/
